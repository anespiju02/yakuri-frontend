<div class="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
  <!-- Navbar Global -->
  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <span class="font-black text-xl text-cyan-400">YAKURI</span>
        <span class="text-xs px-2.5 py-0.5 rounded-full border" [class]="
                api.backendOnline()
                  ? 'border-emerald-500/40 text-emerald-300 bg-emerald-500/10'
                  : 'border-amber-500/40 text-amber-300 bg-amber-500/10'
              ">
          {{ api.backendOnline() ? 'API FastAPI Conectada' : 'Modo Local / Simulación' }}
        </span>
      </div>

      <nav class="flex items-center gap-2 text-xs font-semibold">
        <a routerLink="/presentacion" routerLinkActive="bg-cyan-500 text-slate-950"
          class="px-3.5 py-2 rounded-lg text-slate-300 hover:bg-slate-800 transition">
          1. Presentación
        </a>
        <a routerLink="/escaner" routerLinkActive="bg-cyan-500 text-slate-950"
          class="px-3.5 py-2 rounded-lg text-slate-300 hover:bg-slate-800 transition">
          2. Escáner A–E
        </a>
        <a routerLink="/auditoria-etica" routerLinkActive="bg-cyan-500 text-slate-950"
          class="px-3.5 py-2 rounded-lg text-slate-300 hover:bg-slate-800 transition">
          3. Auditoría Ética (6.3)
        </a>
        <a routerLink="/base-cientifica" routerLinkActive="bg-cyan-500 text-slate-950"
          class="px-3.5 py-2 rounded-lg text-slate-300 hover:bg-slate-800 transition">
          4. Base Científica
        </a>
      </nav>
    </div>
  </header>

  <!-- Vista activa cargada por Lazy Loading -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8">
    <router-outlet />
  </main>
</div>
